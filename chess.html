<style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, query, where, orderBy, limit, onSnapshot, serverTimestamp, arrayUnion }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const $=id=>document.getElementById(id);
const IN=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const VAL={P:100,N:320,B:330,R:500,Q:900,K:0};
const G={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'};
const DIRS={N:[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]],B:[[1,1],[1,-1],[-1,1],[-1,-1]],R:[[1,0],[-1,0],[0,1],[0,-1]]};
DIRS.K=DIRS.B.concat(DIRS.R);DIRS.Q=DIRS.K;
const isW=p=>p===p.toUpperCase();
const opp=t=>t==='w'?'b':'w';

/* ---------- الأصوات (WebAudio — بدون ملفات صوتية) ---------- */
const GameSound=(()=>{
  let ctx=null,muted=false;
  try{muted=localStorage.getItem('sound_muted')==='1';}catch(e){}
  function getCtx(){
    if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;ctx=new AC();}
    if(ctx.state==='suspended')ctx.resume();
    return ctx;}
  ['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>getCtx(),{once:true,passive:true}));
  function tone(freq,start,dur,type='sine',vol=.25,slideTo=null){
    const c=getCtx();if(!c||muted)return;
    const t0=c.currentTime+start,osc=c.createOscillator(),gain=c.createGain();
    osc.type=type;osc.frequency.setValueAtTime(freq,t0);
    if(slideTo)osc.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
    gain.gain.setValueAtTime(.0001,t0);
    gain.gain.exponentialRampToValueAtTime(vol,t0+.01);
    gain.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    osc.connect(gain).connect(c.destination);osc.start(t0);osc.stop(t0+dur+.02);}
  const S={
    move(){tone(220,0,.09,'triangle',.3,140);},
    capture(){tone(160,0,.14,'square',.22,70);tone(320,0,.06,'triangle',.2);},
    castle(){tone(220,0,.08,'triangle',.3,140);tone(260,.1,.08,'triangle',.3,160);},
    check(){tone(880,0,.12,'sawtooth',.15);tone(660,.12,.18,'sawtooth',.15);},
    promote(){[523,659,784,1046].forEach((f,i)=>tone(f,i*.07,.12,'sine',.25));},
    win(){[523,659,784,1046].forEach((f,i)=>tone(f,i*.12,.22,'triangle',.28));},
    lose(){[392,330,262,196].forEach((f,i)=>tone(f,i*.16,.26,'sine',.28));},
    draw(){tone(440,0,.2,'sine',.25);tone(440,.25,.2,'sine',.25);},
    start(){tone(440,0,.1,'sine',.25);tone(660,.12,.16,'sine',.25);}};
  return{
    play(n){try{(S[n]||S.move)();}catch(e){}},
    toggle(){muted=!muted;try{localStorage.setItem('sound_muted',muted?'1':'0');}catch(e){}return !muted;},
    isMuted:()=>muted};})();
$('sn').textContent=GameSound.isMuted()?'🔇':'🔊';
$('sn').onclick=()=>{$('sn').textContent=GameSound.toggle()?'🔊':'🔇';};

function init(){const b=Array(64).fill('');
  'rnbqkbnr'.split('').forEach((p,i)=>{b[i]=p;b[56+i]=p.toUpperCase();b[8+i]='p';b[48+i]='P';});
  return {b,t:'w',c:{K:1,Q:1,k:1,q:1},ep:-1};}

function attacked(b,sq,by){
  const r=sq>>3,c=sq&7,w=by==='w',up=w?1:-1;
  for(const dc of [-1,1]){const rr=r+up,cc=c+dc;if(IN(rr,cc)&&b[rr*8+cc]===(w?'P':'p'))return true;}
  const has=(a,d,list,slide)=>{let rr=r+a,cc=c+d;
    while(IN(rr,cc)){const p=b[rr*8+cc];
      if(p)return isW(p)===w&&list.includes(p.toUpperCase());
      if(!slide)return false;rr+=a;cc+=d;}
    return false;};
  for(const [a,d] of DIRS.N)if(has(a,d,'N',0))return true;
  for(const [a,d] of DIRS.K)if(has(a,d,'K',0))return true;
  for(const [a,d] of DIRS.B)if(has(a,d,'BQ',1))return true;
  for(const [a,d] of DIRS.R)if(has(a,d,'RQ',1))return true;
  return false;}

function gen(s){
  const {b,t}=s,out=[],mine=p=>isW(p)===(t==='w'),en=opp(t);
  for(let sq=0;sq<64;sq++){
    const p=b[sq];if(!p||!mine(p))continue;
    const r=sq>>3,c=sq&7,u=p.toUpperCase();
    if(u==='P'){
      const d=t==='w'?-1:1,st=t==='w'?6:1,pr=t==='w'?0:7;
      const add=(to,x)=>{if((to>>3)===pr)for(const q of 'QRBN')out.push({f:sq,t:to,p:q});else out.push(Object.assign({f:sq,t:to},x));};
      if(IN(r+d,c)&&!b[(r+d)*8+c]){
        add((r+d)*8+c);
        if(r===st&&!b[(r+2*d)*8+c])out.push({f:sq,t:(r+2*d)*8+c,dbl:1});}
      for(const dc of [-1,1]){
        const rr=r+d,cc=c+dc;if(!IN(rr,cc))continue;
        const to=rr*8+cc;
        if(b[to]&&!mine(b[to]))add(to);
        else if(to===s.ep)out.push({f:sq,t:to,e:1});}
      continue;}
    const slide=u==='B'||u==='R'||u==='Q';
    for(const [a,d] of DIRS[u]){
      let rr=r+a,cc=c+d;
      while(IN(rr,cc)){
        const to=rr*8+cc;
        if(b[to]){if(!mine(b[to]))out.push({f:sq,t:to});break;}
        out.push({f:sq,t:to});
        if(!slide)break;rr+=a;cc+=d;}}
    if(u==='K'){
      const row=t==='w'?56:0;
      if(sq===row+4&&!attacked(b,sq,en)){
        if(s.c[t==='w'?'K':'k']&&!b[row+5]&&!b[row+6]&&b[row+7]===(t==='w'?'R':'r')&&!attacked(b,row+5,en)&&!attacked(b,row+6,en))out.push({f:sq,t:row+6,cs:1});
        if(s.c[t==='w'?'Q':'q']&&!b[row+3]&&!b[row+2]&&!b[row+1]&&b[row]===(t==='w'?'R':'r')&&!attacked(b,row+3,en)&&!attacked(b,row+2,en))out.push({f:sq,t:row+2,cs:2});}}
  }
  return out;}

function apply(s,m){
  const b=s.b.slice(),p=b[m.f],t=s.t,c=Object.assign({},s.c);let ep=-1;
  b[m.t]=m.p?(t==='w'?m.p:m.p.toLowerCase()):p;b[m.f]='';
  if(m.e)b[m.t+(t==='w'?8:-8)]='';
  if(m.dbl)ep=(m.f+m.t)/2;
  if(m.cs===1){b[m.t-1]=b[m.t+1];b[m.t+1]='';}
  if(m.cs===2){b[m.t+1]=b[m.t-2];b[m.t-2]='';}
  if(p==='K'){c.K=c.Q=0;}if(p==='k'){c.k=c.q=0;}
  for(const q of [m.f,m.t]){if(q===63)c.K=0;if(q===56)c.Q=0;if(q===7)c.k=0;if(q===0)c.q=0;}
  return {b,t:opp(t),c,ep};}

const kingSq=(b,t)=>b.indexOf(t==='w'?'K':'k');
const inCheck=s=>attacked(s.b,kingSq(s.b,s.t),opp(s.t));
function legal(s){return gen(s).filter(m=>{const n=apply(s,m);return !attacked(n.b,kingSq(n.b,s.t),opp(s.t));});}

function ev(s){let v=0;
  for(let i=0;i<64;i++){const p=s.b[i];if(!p)continue;
    const u=p.toUpperCase(),w=isW(p),r=i>>3,c=i&7;
    let x=VAL[u];
    if(u!=='K')x+=(7-Math.abs(7-2*c)-Math.abs(7-2*r))*(u==='P'?2:3);
    if(u==='P')x+=(w?6-r:r-1)*6;
    v+=w?x:-x;}
  return v+Math.random()*2;}

function search(s,d,a,b){
  const ms=legal(s);
  if(!ms.length)return inCheck(s)?-99999-d:0;
  if(!d)return ev(s)*(s.t==='w'?1:-1);
  ms.sort((x,y)=>(s.b[y.t]?1:0)-(s.b[x.t]?1:0));
  for(const m of ms){
    const v=-search(apply(s,m),d-1,-b,-a);
    if(v>=b)return v;if(v>a)a=v;}
  return a;}

let S=init(),hist=[],sel=-1,moves=[],last=null,busy=false,over=false;
let mode='ai',my='w',flip=false,gid=null,gm=null,gUnsub=null,me=null,myNm='',joined=false,wl=[],started=false;
let gmKey=null;

/* ---------- مؤثرات الحركات ---------- */
function sfx(prev,next,lm){
  const cnt=s=>s.b.reduce((a,p)=>a+(p?1:0),0);
  const fp=prev.b[lm.f],tp=next.b[lm.t];
  let k='move';
  if(fp&&fp.toUpperCase()==='P'&&tp&&tp.toUpperCase()!=='P')k='promote';
  else if(fp&&fp.toUpperCase()==='K'&&Math.abs(lm.f-lm.t)===2)k='castle';
  else if(cnt(prev)>cnt(next))k='capture';
  if(inCheck(next)&&legal(next).length)k='check';
  GameSound.play(k);}
const endSnd=(k,delay)=>setTimeout(()=>GameSound.play(k),delay||0);
function aiEnd(){
  if(legal(S).length)return;
  endSnd(inCheck(S)?(S.t==='w'?'lose':'win'):'draw',450);}
const gkey=g=>g.b+g.t+(g.over?'1':'0')+(g.msg||'');

function draw(){
  const cells=$('bd').children;
  for(let k=0;k<64;k++){
    const i=flip?63-k:k,e=cells[k],p=S.b[i];
    e.textContent=p?G[p.toUpperCase()]+'︎':'';
    e.className='sq '+(((i>>3)+(i&7))%2?'d':'l')+(p?(isW(p)?' wp':' bp'):'')+(i===sel?' sel':'')+(last&&(i===last.f||i===last.t)?' lm':'')+(moves.some(m=>m.t===i)?(p?' cap':' dot'):'');}}

function upd(){
  if(mode==='on')return onUpd();
  const ms=legal(S),chk=inCheck(S);
  if(!ms.length){over=true;$('st').textContent=chk?(S.t==='w'?'كش مات — خسرت 😔':'كش مات — ربحت 🎉'):'تعادل (لا حركات ممكنة) 🤝';}
  else{over=false;$('st').textContent=(S.t==='w'?'دورك (الأبيض)':'الحاسوب يفكر…')+(chk?' — كش!':'');}
  draw();}

function ai(){
  const ms=legal(S);let best=-1e9,bm=ms[0];
  ms.sort((x,y)=>(S.b[y.t]?1:0)-(S.b[x.t]?1:0));
  for(const m of ms){const v=-search(apply(S,m),2,-1e9,-best);if(v>best){best=v;bm=m;}}
  const prev=S;
  S=apply(S,bm);last=bm;busy=false;sfx(prev,S,bm);aiEnd();upd();}

function play(m){
  if(mode==='on')return push(m);
  hist.push(S);const prev=S;S=apply(S,m);last=m;sel=-1;moves=[];sfx(prev,S,m);aiEnd();upd();
  if(!over&&S.t==='b'){busy=true;setTimeout(ai,60);}}

function tap(i){
  if(over||busy||S.t!==my)return;
  const mv=moves.filter(m=>m.t===i);
  if(sel>=0&&mv.length){play(mv.find(m=>m.p==='Q')||mv[0]);return;}
  const p=S.b[i];
  if(p&&isW(p)===(my==='w')){sel=i;moves=legal(S).filter(m=>m.f===i);}else{sel=-1;moves=[];}
  draw();}

for(let i=0;i<64;i++){const b=document.createElement('button');b.type='button';b.onclick=()=>tap(flip?63-i:i);$('bd').appendChild(b);}
$('nw').onclick=()=>{if(busy)return;S=init();hist=[];sel=-1;moves=[];last=null;GameSound.play('start');upd();};
$('un').onclick=()=>{if(busy||!hist.length)return;S=hist.pop();sel=-1;moves=[];last=null;upd();};
/* ---------- أونلاين ---------- */
const app=initializeApp({apiKey:"AIzaSyA5_-Qg0XcIVzaP2_iljrhSFJIrYOQP69k",authDomain:"unfollow-radar-f4508.firebaseapp.com",projectId:"unfollow-radar-f4508",appId:"1:160025889873:web:71b2bcfdfc4c8081433c70"});
const auth=getAuth(app),db=getFirestore(app);
const lerr=e=>{$('st').textContent='تعذّر الاتصال بقاعدة البيانات ('+((e&&e.code)||'خطأ')+'). تأكد من نشر قواعد Firestore.';};
const ser=s=>({b:s.b.map(p=>p||'.').join(''),t:s.t,c:Object.keys(s.c).filter(k=>s.c[k]).join(''),ep:s.ep});
const de=d=>({b:d.b.split('').map(x=>x==='.'?'':x),t:d.t,c:{K:+d.c.includes('K'),Q:+d.c.includes('Q'),k:+d.c.includes('k'),q:+d.c.includes('q')},ep:d.ep});
function show(){
  const on=mode==='on';
  $('ai-ui').style.display=on?'none':'';
  $('on-ui').style.display=on&&!gid?'flex':'none';
  $('gm-ui').style.display=on&&gid?'':'none';
  $('bd').style.display=(!on||gid)?'':'none';
  $('m-ai').className=on?'g':'';$('m-on').className=on?'':'g';}
function applyGame(silent){
  const prev=S,fresh=gmKey===null,nk=gkey(gm);
  my=gm.white===me.uid?'w':'b';flip=my==='b';
  const ns=de(gm);
  if(!silent){
    if(fresh)GameSound.play('start');
    else if(nk!==gmKey){
      const moved=ser(prev).b!==gm.b;
      if(moved&&gm.last)sfx(prev,ns,gm.last);
      if(gm.over){
        const ended=!legal(ns).length;
        endSnd(ended?(inCheck(ns)?'lose':'draw'):((gm.msg||'').includes('تعادل')?'draw':'win'),moved?450:0);}}}
  gmKey=nk;
  S=ns;last=gm.last;over=!!gm.over;sel=-1;moves=[];show();onUpd();}
function setMode(m){
  mode=m;
  if(m==='ai'){my='w';flip=false;S=init();hist=[];sel=-1;moves=[];last=null;over=false;busy=false;show();upd();}
  else{show();if(gid&&gm)applyGame(true);else onUpd();renderLobby();}}
function onUpd(){
  if(!gid||!gm){$('st').textContent=gid?'جارٍ فتح المباراة…':(me?(joined?'⏳ أنت في قائمة الانتظار… اضغط على شخص لتبدأ معه':'اضغط «أريد اللعب» أو تحدَّ شخصا من القائمة'):'سجّل الدخول من صفحة الدردشة للعب أونلاين');draw();return;}
  const o=gm.names[gm.players.find(x=>x!==me.uid)]||'الخصم';
  $('st').textContent=over?gm.msg:((S.t===my?'دورك':'دور '+o)+(inCheck(S)?' — كش!':'')+' · أنت '+(my==='w'?'الأبيض':'الأسود'));
  draw();}
function push(m){
  const n=apply(S,m),end=!legal(n).length,chk=inCheck(n);
  const data=Object.assign(ser(n),{last:{f:m.f,t:m.t},over:end,msg:end?(chk?'كش مات — فاز '+myNm+' 🏆':'تعادل 🤝'):'',updatedAt:serverTimestamp()});
  if(end)data.live=[];
  sfx(S,n,data.last);
  if(end)endSnd(chk?'win':'draw',450);
  gmKey=gkey(data);
  S=n;last=data.last;over=end;sel=-1;moves=[];
  if(end)gm=Object.assign({},gm,{over:true,msg:data.msg});
  onUpd();
  updateDoc(doc(db,'games',gid),data).catch(e=>{$('st').textContent='تعذّر إرسال الحركة ('+((e&&e.code)||'خطأ')+'). تأكد من قواعد Firestore والاتصال.';});}
function openGame(id){
  if(gid===id)return;
  if(gUnsub)gUnsub();
  rtcStop(true);
  gid=id;gm=null;gmKey=null;
  gUnsub=onSnapshot(doc(db,'games',id),s=>{
    if(!s.exists()){closeGame();return;}
    gm=s.data();
    if(mode==='on'&&gkey(gm)!==gmKey)applyGame();
    rtcSync();},e=>{closeGame();lerr(e);});
  setMode('on');}
function closeGame(){if(gUnsub)gUnsub();gUnsub=null;rtcStop(true);gid=null;gm=null;gmKey=null;over=false;show();onUpd();renderLobby();}
$('gx').onclick=()=>{
  if(gm&&!over){
    if(!confirm('الخروج يعني الاستسلام. متأكد؟'))return;
    updateDoc(doc(db,'games',gid),{over:true,live:[],msg:'استسلم '+myNm,updatedAt:serverTimestamp()}).catch(()=>{});}
  closeGame();};
function renderLobby(){
  const box=$('wl');box.textContent='';
  $('jn').style.display=me?'':'none';
  $('jn').textContent=joined?'إلغاء الانتظار':'🙋 أريد اللعب';
  if(!me){const a=document.createElement('a');a.href='./chat.html';a.textContent='سجّل الدخول من الدردشة أولا';box.appendChild(a);return;}
  if(!wl.length){const p=document.createElement('p');p.className='hint';p.textContent='لا أحد ينتظر الآن. اضغط «أريد اللعب» وانتظر.';box.appendChild(p);return;}
  wl.forEach((u,i)=>{
    const d=document.createElement('div');d.className='it';
    const b=document.createElement('b');b.textContent=(i+1)+'. '+(u.name||'لاعب')+(u.id===me.uid?' (أنت)':'');d.appendChild(b);
    if(u.id!==me.uid){const x=document.createElement('button');x.type='button';x.textContent='ابدأ اللعب';x.onclick=()=>challenge(u);d.appendChild(x);}
    box.appendChild(d);});}
async function challenge(u){
  if(gid)return;const first=Math.random()<.5;
  try{
    const ref=await addDoc(collection(db,'games'),Object.assign(ser(init()),{players:[me.uid,u.id],live:[me.uid,u.id],white:first?me.uid:u.id,black:first?u.id:me.uid,names:{[me.uid]:myNm,[u.id]:u.name||'لاعب'},over:false,msg:'',last:null,updatedAt:serverTimestamp()}));
    if(joined)deleteDoc(doc(db,'lobby',me.uid)).catch(()=>{});
    openGame(ref.id);
  }catch(e){$('st').textContent='تعذّر بدء المباراة ('+(e.code||'خطأ')+')';}}
$('jn').onclick=()=>{
  if(!me)return;
  if(joined)deleteDoc(doc(db,'lobby',me.uid)).catch(()=>{});
  else setDoc(doc(db,'lobby',me.uid),{name:myNm,since:serverTimestamp(),seen:serverTimestamp()}).catch(e=>{$('st').textContent='تعذّر الانضمام ('+(e.code||'خطأ')+')';});};
setInterval(()=>{if(joined&&me)updateDoc(doc(db,'lobby',me.uid),{seen:serverTimestamp()}).catch(()=>{});},45000);
addEventListener('pagehide',()=>{if(joined&&me)deleteDoc(doc(db,'lobby',me.uid)).catch(()=>{});});
$('m-ai').onclick=()=>setMode('ai');
$('m-on').onclick=()=>setMode('on');

/* ---------- الدردشة الصوتية (WebRTC، والإشارات عبر وثيقة المباراة في Firestore) ---------- */
const ICE={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]};
let pc=null,sender=null,rtcId=0,iceDone=0,lastAns='',lastWant=0,rtcBusy=false,rrole='w';
let micStream=null,micTrack=null,micOn=false;

function updMic(){
  $('mic').textContent=micOn?'🎙️ المايك شغّال — اضغط للكتم':(micStream?'🔇 المايك مكتوم — اضغط للتشغيل':'🎙️ تفعيل المايك');
  const st=pc?pc.connectionState:'';
  $('vs').textContent=!gid?'':(st==='connected'?'🟢 الاتصال الصوتي جاهز':(st==='failed'?'🔴 فشل الاتصال الصوتي — جرّب زر 🔄':'⏳ جارٍ الاتصال الصوتي…'));}
function closePc(){
  if(pc){pc.onicecandidate=pc.ontrack=pc.onconnectionstatechange=null;try{pc.close();}catch(e){}pc=null;}
  $('ra').srcObject=null;iceDone=0;sender=null;}
function rtcStop(full){
  closePc();rtcId=0;lastAns='';lastWant=0;rtcBusy=false;
  if(full&&micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;micTrack=null;micOn=false;}
  updMic();}
function mkPc(offerer){
  closePc();
  pc=new RTCPeerConnection(ICE);
  if(offerer){sender=pc.addTransceiver('audio',{direction:'sendrecv'}).sender;if(micTrack)sender.replaceTrack(micTrack).catch(()=>{});}
  pc.ontrack=e=>{$('ra').srcObject=e.streams[0]||new MediaStream([e.track]);$('ra').play().catch(()=>{});};
  pc.onicecandidate=e=>{if(e.candidate&&gid)updateDoc(doc(db,'games',gid),{['ice_'+rrole]:arrayUnion(JSON.stringify(e.candidate))}).catch(()=>{});};
  pc.onconnectionstatechange=updMic;
  updMic();}
function drainIce(){
  const arr=(gm&&gm['ice_'+opp(rrole)])||[];
  while(pc&&pc.remoteDescription&&iceDone<arr.length)pc.addIceCandidate(JSON.parse(arr[iceDone++])).catch(()=>{});}
async function startOffer(){
  const ref=doc(db,'games',gid);
  await updateDoc(ref,{rtc_offer:null,rtc_answer:null,ice_w:[],ice_b:[]});
  mkPc(true);
  const id=Date.now();rtcId=id;lastAns='';
  const o=await pc.createOffer();await pc.setLocalDescription(o);
  await updateDoc(ref,{rtc_offer:{id,sdp:o.sdp}});}
async function rtcSync(){
  if(!gid||!gm||!me||rtcBusy||!window.RTCPeerConnection||gm.over)return;
  rrole=gm.white===me.uid?'w':'b';
  rtcBusy=true;
  try{
    if(rrole==='w'){
      const want=gm.rtc_want||0;
      if(!pc||want!==lastWant){lastWant=want;await startOffer();}
      else{
        const a=gm.rtc_answer;
        if(a&&a.sdp!==lastAns){
          lastAns=a.sdp;
          if(a.id===rtcId){
            if(pc.signalingState==='have-local-offer')await pc.setRemoteDescription({type:'answer',sdp:a.sdp});
            else await startOffer();}}}}
    else{
      const o=gm.rtc_offer;
      if(o&&o.id!==rtcId){
        rtcId=o.id;mkPc(false);
        await pc.setRemoteDescription({type:'offer',sdp:o.sdp});
        const t=pc.getTransceivers()[0];t.direction='sendrecv';sender=t.sender;
        if(micTrack)sender.replaceTrack(micTrack).catch(()=>{});
        const an=await pc.createAnswer();await pc.setLocalDescription(an);
        await updateDoc(doc(db,'games',gid),{rtc_answer:{id:o.id,sdp:an.sdp}});}}
    drainIce();
  }catch(e){}
  rtcBusy=false;}
$('mic').onclick=async()=>{
  if(!micStream){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('vs').textContent='المتصفح لا يدعم المايك (يلزم رابط https).';return;}
    try{
      micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
      micTrack=micStream.getAudioTracks()[0];micOn=true;
      if(sender)sender.replaceTrack(micTrack).catch(()=>{});
    }catch(e){$('vs').textContent='تعذّر تشغيل المايك — اسمح للموقع باستخدامه من إعدادات المتصفح.';return;}}
  else{micOn=!micOn;micTrack.enabled=micOn;}
  $('ra').play().catch(()=>{});
  updMic();};
$('rc').onclick=()=>{
  if(!gid||!gm)return;
  if(rrole==='w'){if(!rtcBusy){rtcBusy=true;startOffer().catch(()=>{}).finally(()=>{rtcBusy=false;});}}
  else updateDoc(doc(db,'games',gid),{rtc_want:Date.now()}).catch(()=>{});};
addEventListener('pointerdown',()=>{const a=$('ra');if(a.srcObject)a.play().catch(()=>{});});

onAuthStateChanged(auth,async u=>{
  me=u;
  if(!u){renderLobby();if(mode==='on')onUpd();return;}
  myNm=u.displayName||'لاعب';
  try{const d=await getDoc(doc(db,'users',u.uid));if(d.exists()&&d.data().name)myNm=d.data().name;}catch{}
  if(!started){
    started=true;
    onSnapshot(query(collection(db,'lobby'),orderBy('since'),limit(30)),s=>{
      wl=s.docs.map(d=>Object.assign({id:d.id},d.data({serverTimestamps:'estimate'}))).filter(x=>x.seen&&x.seen.toMillis()>Date.now()-180000);
      joined=wl.some(x=>x.id===me.uid);renderLobby();if(mode==='on'&&!gid)onUpd();},e=>lerr(e));
    onSnapshot(query(collection(db,'games'),where('live','array-contains',u.uid)),s=>{
      if(gid)return;
      const g=s.docs.find(d=>{const t=d.data({serverTimestamps:'estimate'}).updatedAt;return t&&t.toMillis()>Date.now()-6*3600e3;});
      if(g){if(joined)deleteDoc(doc(db,'lobby',u.uid)).catch(()=>{});openGame(g.id);}},e=>lerr(e));}
  renderLobby();if(mode==='on')onUpd();});
show();
upd();
</script>
