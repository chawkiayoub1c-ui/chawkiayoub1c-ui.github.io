};
const lsg=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lss=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let L=lsg('lang');if(!T[L])L=(navigator.language||'ar').slice(0,2);if(!T[L])L='ar';
const t=k=>T[L][k]||T.en[k]||k;
class E extends Error{constructor(k,a){super(k);this.k=k;this.a=a}}
let non=[],done=new Set(),lastErr=null,lostArr=[],wl=new Set();
try{wl=new Set(JSON.parse(lsg('wl')||'[]'))}catch(e){}
const saveW=()=>lss('wl',JSON.stringify([...wl]));
try{done=new Set(JSON.parse(lsg('done')||'[]'))}catch(e){}
const save=()=>lss('done',JSON.stringify([...done]));
const msg=e=>e&&e.k?t(e.k).replace('{a}',e.a||''):t('eG');
function apply(){
  const d=document.documentElement;d.lang=L;d.dir=L==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=t(e.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  document.querySelectorAll('[data-al]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.al)));
  $('md').content=t('md');
  $('err').textContent=lastErr?msg(lastErr):'';
  if(non.length)render();
  renderLost();
}
function loadGT(){
  if(window.google&&google.translate)return;
  window.gtInit=()=>new google.translate.TranslateElement({pageLanguage:L,autoDisplay:false,layout:google.translate.TranslateElement.InlineLayout.SIMPLE},'gt');
  const s=document.createElement('script');s.src='https://translate.google.com/translate_a/element.js?cb=gtInit';
  s.onerror=()=>{$('gt').textContent=t('eO')};document.head.append(s);
}
$('lang').onchange=e=>{
  const v=e.target.value;
  if(v==='other'){lss('gt','1');$('gt').textContent='';loadGT();return}
  const had=lsg('gt')==='1';L=v;lss('lang',v);lss('gt','0');
  if(had){document.cookie='googtrans=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';location.reload();return}
  $('gt').textContent='';apply();
};
const read=f=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>{try{ok(JSON.parse(r.result))}catch(e){ko(new E('eJ',f.name))}};r.onerror=()=>ko(new E('eR',f.name));r.readAsText(f)});
function names(data){
  let arr=Array.isArray(data)?data:(data.relationships_following||data.relationships_followers||[]);
  const out=[];
  for(const e of arr){
    const s=(e.string_list_data&&e.string_list_data[0])||{};
    const u=(s.value||e.title||'').trim();
    if(u)out.push(u.toLowerCase());
  }
  return out;
}
const upd=()=>{$('go').disabled=!($('fz').files.length||($('f1').files.length&&$('f2').files.length))};
$('f1').onchange=upd;$('f2').onchange=upd;$('fz').onchange=upd;
async function load(){
  const fl=new Set();let fg=[];
  if($('fz').files.length){
    if(typeof JSZip==='undefined')throw new E('eZ');
    const z=await JSZip.loadAsync($('fz').files[0]);
    let found=false;
    for(const n of Object.keys(z.files)){
      const base=n.split('/').pop();
      if(/^followers_\d+\.json$/.test(base)){names(JSON.parse(await z.files[n].async('string'))).forEach(x=>fl.add(x));found=true}
      else if(base==='following.json'){fg=names(JSON.parse(await z.files[n].async('string')));found=true}
    }
    if(!found)throw new E('eF');
  }else{
    for(const f of $('f1').files)names(await read(f)).forEach(n=>fl.add(n));
    fg=names(await read($('f2').files[0]));
  }
  return {fl,fg};
}
$('go').onclick=async()=>{
  lastErr=null;$('err').textContent='';
  try{
    const {fl,fg}=await load();
    if(!fl.size||!fg.length)throw new E('eN');
    const fgs=new Set(fg);
    non=[...fgs].filter(n=>!fl.has(n)).sort();
    $('cFollowing').textContent=fgs.size;
    $('cFollowers').textContent=fl.size;
    $('cFans').textContent=[...fl].filter(n=>!fgs.has(n)).length;
    let pv=null;try{pv=JSON.parse(lsg('prev')||'null')}catch(e){}
    lostArr=(pv&&pv.f)?pv.f.filter(n=>!fl.has(n)):[];
    lss('prev',JSON.stringify({f:[...fl]}));
    renderLost();
    $('res').hidden=false;
    render();
  }catch(e){lastErr=e;$('err').textContent=msg(e)}
};
function prog(){
  const act=non.filter(n=>!wl.has(n));
  $('cNon').textContent=act.length;
  $('pg').textContent=t('pg').replace('{a}',act.filter(n=>done.has(n)).length).replace('{b}',act.length);
}
function renderLost(){
  const b=$('lost');
  if(!lostArr.length){b.hidden=true;return}
  b.innerHTML='<b>'+t('lo')+' ('+lostArr.length+')</b><div class="ln"></div>';
  b.querySelector('.ln').textContent=lostArr.join(' · ');b.hidden=false;
}
function render(){
  const q=$('q').value.trim().toLowerCase();
  const box=$('list');box.innerHTML='';
  const items=non.filter(n=>n.includes(q)&&($('shw').checked||!wl.has(n)));
  prog();
  if(!items.length){box.innerHTML='<div class="empty">'+t('nr')+'</div>';return}
  for(const n of items){
    const r=document.createElement('div');r.className='row'+(done.has(n)?' done':'')+(wl.has(n)?' wl':'');
    const c=document.createElement('input');c.type='checkbox';c.checked=done.has(n);c.setAttribute('aria-label',t('dn')+n);
    c.onchange=()=>{c.checked?done.add(n):done.delete(n);save();r.classList.toggle('done',c.checked);prog()};
    const s=document.createElement('span');s.className='n';s.textContent=n;
    const w=document.createElement('button');w.type='button';w.className='star';w.textContent=wl.has(n)?'★':'☆';w.title=t('pt');w.setAttribute('aria-label',t('pt')+': '+n);
    w.onclick=()=>{wl.has(n)?wl.delete(n):wl.add(n);saveW();render()};
    const a=document.createElement('a');a.href='https://www.instagram.com/'+encodeURIComponent(n)+'/';a.target='_blank';a.rel='noopener';a.textContent=t('op');
    r.append(c,s,w,a);box.append(r);
  }
}
$('q').oninput=render;
$('shw').onchange=render;
$('ex').onclick=()=>{
  const rows=['username,profile,status'].concat(non.filter(n=>!wl.has(n)).map(n=>n+',https://www.instagram.com/'+n+'/,'+(done.has(n)?'done':'todo')));
  const b=new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='unfollow-radar.csv';document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
};
// ضع هنا معرّف فيديو يوتيوب (مثال: 'dQw4w9WgXcQ') أو مسار ملف مثل 'tuto.mp4'
const VIDEO='';
(function(){if(!VIDEO)return;let e;
if(/\.(mp4|webm)$/i.test(VIDEO)){e=document.createElement('video');e.src=VIDEO;e.controls=true;e.playsInline=true;e.preload='metadata'}
else{e=document.createElement('iframe');e.src='https://www.youtube-nocookie.com/embed/'+VIDEO;e.allowFullscreen=true;e.title='Video'}
e.style.cssText='width:100%;aspect-ratio:16/9;border:0;display:block';$('vbox').append(e);$('vid').hidden=false})();
const GT=lsg('gt')==='1';
$('lang').value=GT?'other':L;
apply();
if(GT)loadGT();
(function(){
  const url=location.origin+location.pathname;
  let tt;
  function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
  function fallback(){
    const i=document.createElement('input');i.value=url;document.body.appendChild(i);i.select();
    try{document.execCommand('copy');toast(t('cpd'))}catch(e){}
    i.remove();
  }
  function copyLink(){
    if(navigator.clipboard&&window.isSecureContext){
      navigator.clipboard.writeText(url).then(()=>toast(t('cpd'))).catch(fallback);
    }else fallback();
  }
  $('btnCopy').onclick=copyLink;
  $('btnShare').onclick=()=>{
    if(navigator.share)navigator.share({title:'Unfollow Radar',text:t('shX'),url}).catch(()=>{});
    else copyLink();
  };
})();
</script>

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>

<button id="instBtn" type="button" hidden>⬇️ <span id="instTxt"></span></button>
<script>
(function(){
  var b=document.getElementById('instBtn'),tx=document.getElementById('instTxt'),sel=document.getElementById('lang'),ev=null;
  if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)return;
  var T={ar:'تثبيت التطبيق',fr:"Installer l'app",en:'Install app'};
  var H={ar:'فـ iPhone: زر المشاركة ⬆️ فـ Safari ثم «إضافة إلى الشاشة الرئيسية».',fr:"Sur iPhone : bouton Partager ⬆️ dans Safari, puis « Sur l'écran d'accueil ».",en:'On iPhone: tap Share ⬆️ in Safari, then “Add to Home Screen”.'};
  var M={ar:'افتح قائمة المتصفح (⋮) واختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».',fr:"Ouvrez le menu du navigateur (⋮) puis « Installer l'application » ou « Ajouter à l'écran d'accueil ».",en:'Open the browser menu (⋮) and choose “Install app” or “Add to Home screen”.'};
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  function lg(){var l=(sel&&sel.value)||document.documentElement.lang||'ar';return T[l]?l:'en'}
  function up(){tx.textContent=T[lg()]}
  if(sel)sel.addEventListener('change',up);up();
  addEventListener('beforeinstallprompt',function(e){e.preventDefault();ev=e;b.hidden=false});
  addEventListener('appinstalled',function(){b.hidden=true;ev=null});
  if(ios)b.hidden=false;
  b.onclick=function(){
    if(ev){ev.prompt();ev.userChoice.then(function(){ev=null;b.hidden=true},function(){});}
    else alert((ios?H:M)[lg()]);
  };
})();
</script>
