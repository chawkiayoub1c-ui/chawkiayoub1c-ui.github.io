d);o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+d)}catch(e){}\n}\nfunction noise(d,v,fq,type='lowpass',q=1){\n  if(muted)return;const A=ac();if(!A)return;\n  try{ensureNoise(A);const sn=A.createBufferSource();sn.buffer=noiseBuf;const f=A.createBiquadFilter();f.type=type;f.frequency.value=fq;f.Q.value=q;const g=A.createGain();g.gain.setValueAtTime(v,A.currentTime);g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+d);sn.connect(f);f.connect(g);g.connect(A.destination);sn.start();sn.stop(A.currentTime+d)}catch(e){}\n}\nfunction volAt(x,y){\n  if(!state||x==null)return 1;\n  const f=(views[0]&&views[0].f)||state.players[mySlot];if(!f)return 1;\n  return Math.max(0,1-Math.hypot((f.rx??f.x)-x,(f.ry??f.y)-y)/750);\n}\nfunction sfx(k,w,x,y){\n  const vl=volAt(x,y);if(vl<=.03)return;\n  if(k==='shot'){\n    const big=w==='awm'||w==='kar'||w==='m249';\n    noise(big?.4:.2,.35*vl,big?900:2400);beep(big?65:105,.15,'sine',.14*vl,38);\n    if(w==='s12k'){noise(.35,.3*vl,650)}\n    if(w==='p18'||w==='ump')beep(900,.03,'square',.03*vl);\n  }\n  else if(k==='hit'){noise(.12,.3*vl,1600,'bandpass',2);beep(170,.1,'sawtooth',.05*vl,90)}\n  else if(k==='kill'){beep(500,.1,'triangle',.06);setTimeout(()=>beep(750,.15,'triangle',.06),90)}\n  else if(k==='pick')beep(900,.07,'sine',.05*vl);\n  else if(k==='reload'){noise(.05,.2*vl,3000,'highpass');setTimeout(()=>noise(.07,.25*vl,2000,'highpass'),350);beep(260,.06,'square',.03*vl)}\n  else if(k==='crate'){noise(.5,.25*vl,500);beep(150,.45,'triangle',.08*vl,480)}\n  else if(k==='step')noise(.05,.16*vl,420);\n  else if(k==='thunder'){noise(1.4,.45,160);beep(55,1.1,'sawtooth',.08,22)}\n  else if(k==='wail'){beep(360,1.6,'sine',.02,150);setTimeout(()=>beep(420,1.2,'sine',.012,170),250)}\n  else if(k==='creak'){beep(120,.5,'sawtooth',.012,210)}\n  else if(k==='boom'){noise(.8,.7*vl,320);noise(.3,.4*vl,1800);beep(60,.6,'sawtooth',.16*vl,24)}\n  else if(k==='throw'){noise(.09,.18*vl,2200,'highpass');beep(300,.08,'triangl =mkPlayer0(i,d,x,y);\n  if(d.local==='main'&&SV.start!=='p18'&&WP[SV.start]&&SV.ws.includes(SV.start)){P0.wp.push({id:SV.start,mag:WP[SV.start].mag,res:WP[SV.start].mag*3});P0.cur=1}\n  return P0;\n}\nfunction mkPlayer0(i,d,x,y){\n  return{id:i,name:d.name,color:COLORS[i],bot:!!d.bot,local:d.local||null,x,y,aim:0,hp:100,armor:0,alive:true,\n    wp:[{id:'p18',mag:17,res:999}],cur:0,rl:0,cd:0,resp:0,inv:2,flash:0,score:0,gren:2,gcd:0,mines:1,mcd:0,\n    ai:{path:[],t:0,seen:0,sT:0,sd:1,swT:0,lx:x,ly:y,st:0,gk:''},\n    line:d.line||0,evo:0,stage:0,mhp:100,cd1:0,cd2:0,buff:0,fxR:0,fxT:0};\n}\nfunction newState(seed,defs,win){\n  genWorld(seed);\n  const zs=randSpot();\n  {const used=new Set(defs.filter(d=>d.line!=null).map(d=>d.line));\n   defs.forEach((d,i)=>{if(d.line!=null)return;let l=i===0?cfg.line:0;while(used.has(l))l=(l+1)%LINES.length;d.line=l;used.add(l)})}\n  const corners=[[0,0],[MW-1,MH-1],[MW-1,0],[0,MH-1]];\n  state={seed,win:win||10,t:0,players:defs.map((d,i)=>{const [x,y]=cellC(...corners[i]);return mkPlayer(i,d,x,y)}),\n    bullets:[],items:[],crates:[],grens:[],booms:[],mines:[],feed:[],over:null,spawnT:3,crateT:0,day:!!cfg.day,zone:{x:zs[0],y:zs[1],r:150,t:0}};\n  for(let i=0;i<34;i++)spawnLoot();\n  for(let i=0;i<4;i++)spawnCrate();\n  $('over').classList.add('hidden');\n}\nfunction pickWeighted(tab){let t=0;tab.forEach(a=>t+=a[1]);let r=Math.random()*t;for(const [k,w] of tab){r-=w;if(r<=0)return k}return tab[0][0]}\nfunction spawnLoot(){const [x,y]=randSpot();state.items.push({x,y,k:pickWeighted(LOOT),nt:0})}\nfunction spawnCrate(){const [x,y]=randSpot();state.crates.push({x,y,prog:0,open:false,t:0})}\nfunction dropItem(x,y,k){\n  let px=x+(Math.random()-.5)*26, py=y+(Math.random()-.5)*26; if(collides(px,py,6)){px=x;py=y}\n  state.items.push({x:px,y:py,k,nt:state.t+1.5});\n}\nfunction respawn(p){\n  let best=null,bd=-1;\n  for(let i=0;i<14;i++){\n    const [x,y]=randSpot(); let md=1e9; state.players.forEach(q=>{if(q!==p&&q.alive)md=Math.min(md,Math.hypot(q.x-x,q.y-y))});\n    if(md>bd){bd=md;best=[x,y]}\n  }\n  p.x=best[0];p.y=best[1];p.stage=Math.max(0,p.stage-1);p.evo=EVO[p.stage];p.mhp=MHP[p.stage];p.hp=p.mhp;p.armor=0;p.cd1=p.cd2=0;p.buff=0;p.alive=true;p.wp=[{id:'p18',mag:17,res:999}];p.cur=0;if(isMain(p)&&SV.start!=='p18'&&WP[SV.start]&&SV.ws.includes(SV.start)){p.wp.push({id:SV.start,mag:WP[SV.start].mag,res:WP[SV.start].mag*3});p.cur=1}p.rl=0;p.inv=2;p.cd=.3;p.gren=1;p.mines=0;\n}\nfunction say(s){state.feed.push({s,t:performance.now()});if(state.feed.length>6)state.feed.shift()}\nfunction giveWeapon(p,id){\n  const w=WP[id], ex=p.wp.findIndex(s=>s.id===id);\n  if(ex>=0){const s=p.wp[ex];if(s.res>=900||s.res>=w.mag*5)return false;s.res=Math.min(w.mag*5,s.res+w.mag*2);return true}\n  if(p.wp.length<3){p.wp.push({id,mag:w.mag,res:w.mag*2});if(p.wp[p.cur].id==='p18'){p.cur=p.wp.length-1;p.rl=0;p.cd=.3}return true}\n  let wi=p.cur; if(wi===0)wi=WP[p.wp[2].id].tier<WP[p.wp[1].id].tier?2:1;\n  if(WP[p.wp[wi].id].tier<w.tier){dropItem(p.x,p.y,p.wp[wi].id);p.wp[wi]={id,mag:w.mag,res:w.mag*2};if(wi===p.cur)p.rl=0;return true}\n  return false;\n}\nfunction takeItem(p,it){\n  const k=it.k;\n  if(WP[k])return giveWeapon(p,k);\n  if(k==='grenade'){if(p.gren>=5)return false;p.gren++;return true}\n  if(k==='mine'){if(p.mines>=4)return false;p.mines++;return true}\n  if(k==='ammo'){let ok=false;p.wp.forEach(s=>{const w=WP[s.id];if(s.res<900&&s.res<w.mag*5){s.res=Math.min(w.mag*5,s.res+Math.ceil(w.mag*1.5));ok=true}});return ok}\n  if(k==='bandage'){if(p.hp>=p.mhp)return false;p.hp=Math.min(p.mhp,p.hp+20);return true}\n  if(k==='medkit'){if(p.hp>=p.mhp)return false;p.hp=Math.min(p.mhp,p.hp+75);return true}\n  if(k==='vest'){if(p.armor>=100)return false;p.armor=100;return true}\n  return false;\n}\nfunction startReload(p){\n  const s=p.wp[p.cur],w=WP[s.id]; if(p.rl>0||s.mag>=w.mag||s.res<=0)return;\n  p.rl=w.rl;sfx('reload',null,p.x,p.y);\n}\nfunction hurt(q,dmg){\n  const ab=Math.min(q.armor,dmg*.5); q.armor-=ab; q.hp-=dmg-ab;\n}\n\nfunction addEvo(p,n){\n  if(!p||!p.alive||!state||state.over)return;\n  const old=p.stage;p.evo+=n;p.stage=stageOf(p.evo);\n  if(p.stage>old){\n    p.mhp=MHP[p.stage];p.hp=Math.min(p.mhp,p.hp+Math.round(p.mhp*.5));p.inv=Math.max(p.inv,1.5);p.fxR=110;p.fxT=.5;\n    say('🌟 '+p.name+' تطور إلى '+formName(p)+' '+formEmoji(p));sfx('evolve',null,p.x,p.y);\n  }\n}\nfunction dealDmg(q,dmg,oid,tag){\n  hurt(q,dmg);sfx('hit',null,q.x,q.y);\n  if(q.hp>0)return;\n  const k=state.players[oid];\n  if(k===q){q.alive=false;q.resp=3;say('💥 '+q.name+' فجّر نفسه');q.wp.forEach((s,i)=>{if(i>0)dropItem(q.x,q.y,s.id)});if(q.gren>0)dropItem(q.x,q.y,'grenade');if(q.mines>0)dropItem(q.x,q.y,'mine');return}\n  q.alive=false;q.resp=3;k.score++;sfx('kill');if(isMain(k))addCoins(12);\n  say(k.name+' 🔫 '+q.name+'  ['+(tag||WP[k.wp[k.cur].id].n)+']');\n  q.wp.forEach((s,idx)=>{if(idx>0)dropItem(q.x,q.y,s.id)});\n  if(q.armor>40)dropItem(q.x,q.y,'vest'); dropItem(q.x,q.y,'ammo');if(q.gren>0)dropItem(q.x,q.y,'grenade');if(q.mines>0)dropItem(q.x,q.y,'mine');\n  addEvo(k,60+Math.round(q.evo*.25));\n  if(k.score>=state.win){state.over={win:k.id};if(isMain(k))addCoins(50)}\n}\nfunction ring(p,n,dmg,sp,life){for(let i=0;i<n;i++){const a=p.aim+i/n*Math.PI*2;state.bullets.push({x:p.x+Math.cos(a)*14,y:p.y+Math.sin(a)*14,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,o:p.id,dmg,life})}}\nfunction cone(p,n,spread,dmg,sp,life){for(let i=0;i<n;i++){const a=p.aim+(n>1?(i/(n-1)-.5)*spread:0);state.bullets.push({x:p.x+Math.cos(a)*16,y:p.y+Math.sin(a)*16,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,o:p.id,dmg,life})}}\nfunction blast(p,rad,dmg,tag){let tot=0;for(const q of state.players){if(q===p||!q.alive||q.inv>0)continue;if(Math.hypot(q.x-p.x,q.y-p.y)<rad&&los(p.x,p.y,q.x,q.y)){tot+=dmg;dealDmg(q,dmg,p.id,tag)}}return tot}\nfunction useAbility(p,n){\n  if(!p.alive)return;\n  if(n===1){if(p.stage<1||p.cd1>0)return;p.cd1=10}\n  else if(n===2){if(p.stage<3||p.cd2>0)return;p.cd2=35}\n  else return;\n  const L=LINES[p. ive||q.inv>0)continue;\n    const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);if(d>38)continue;\n    let a=Math.atan2(dy,dx)-p.aim;while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;\n    if(Math.abs(a)>1.05||!los(p.x,p.y,q.x,q.y))continue;\n    dealDmg(q,Math.round(base),p.id,'🔪');\n  }\n}\nfunction simulate(dt){\n  if(state.over)return;\n  state.t+=dt;\n  const P=state.players;\n  for(const p of P){\n    if(!p.alive){p.resp-=dt;if(p.resp<=0)respawn(p);continue}\n    p.inv=Math.max(0,p.inv-dt);p.cd-=dt;p.flash=Math.max(0,p.flash-dt);p.gcd=Math.max(0,(p.gcd||0)-dt);p.mcd=Math.max(0,(p.mcd||0)-dt);\n    p.cd1=Math.max(0,p.cd1-dt);p.cd2=Math.max(0,p.cd2-dt);p.buff=Math.max(0,p.buff-dt);p.fxT=Math.max(0,p.fxT-dt);\n    let inp;\n    if(p.bot)inp=botInput(p,dt);\n    else if(p.local)inp=getInput(p.local,p);\n    else{inp=Object.assign({mx:0,my:0,aim:p.aim,fire:false},net.inputs[p.id]||{},net.acts[p.id]||{});net.acts[p.id]=null}\n    let mx=+inp.mx||0,my=+inp.my||0;const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}\n    const sp=150*(p.bot?DIFF[cfg.diff].spd:1)*SPD[p.stage]*(p.buff>0?1.6:1);\n    let nx=p.x+mx*sp*dt;if(!collides(nx,p.y,R))p.x=nx;\n    let ny=p.y+my*sp*dt;if(!collides(p.x,ny,R))p.y=ny;\n    p.aim=+inp.aim||0;\n    p.mlc=Math.max(0,(p.mlc||0)-dt);p.mAn=Math.max(0,(p.mAn||0)-dt);p.hsT=Math.max(0,(p.hsT||0)-dt);\n    if(p.bot&&!inp.ml&&p.mlc<=0){for(const q of P)if(q!==p&&q.alive&&q.inv<=0&&Math.hypot(q.x-p.x,q.y-p.y)<30){inp.ml=1;break}}\n    if(inp.ml&&p.mlc<=0)doMelee(p);\n    // تبديل السلاح\n    if(inp.slot&&p.wp[inp.slot-1]&&p.cur!==inp.slot-1){p.cur=inp.slot-1;p.rl=0;p.cd=Math.max(p.cd,.35)}\n    else if(inp.sw&&p.wp.length>1){p.cur=(p.cur+1)%p.wp.length;p.rl=0;p.cd=Math.max(p.cd,.35);sfx('pick',null,p.x,p.y)}\n    if(inp.ab)useAbility(p,inp.ab);\n    const sl=p.wp[p.cur],w=WP[sl.id];\n    if(inp.r)startReload(p);\n    if(p.rl>0){\n      p.rl-=dt;\n      if(p.rl<=0){p.rl=0;const take=Math.min(w.mag-sl.mag,sl.res);sl.mag+=take;if(sl.res<900)sl.res-=t
