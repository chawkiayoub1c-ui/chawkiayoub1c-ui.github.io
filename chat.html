<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دردشة Unfollow Radar</title>
<style>
  :root{
    --bg:#0f1b2d; --surface:#172740; --line:#25385a; --text:#eaf0fa; --muted:#8fa3c4;
    --mine:#ffb454; --mine-text:#2a1b00; --other:#21365a;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
       display:flex;flex-direction:column;height:100dvh;
       padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
  header h1{font-size:1.05rem;flex:1}
  header a{color:var(--muted);font-size:.85rem;text-decoration:none}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--mine);color:var(--mine-text);font-weight:600}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--mine);outline-offset:2px}
  #login{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
  #login p{color:var(--muted);max-width:30ch;line-height:1.7}
  #app{flex:1;display:none;min-height:0;flex-direction:column}
  #status{font-size:.78rem;color:var(--muted);padding:6px 14px;background:var(--bg)}
  #status.off{color:#ffd28a}
  #rooms{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;border-bottom:1px solid var(--line);white-space:nowrap;scrollbar-width:none}
  #rooms button{background:var(--surface);color:var(--text);border:1px solid var(--line);font-weight:500}
  #rooms button.on{background:var(--mine);color:var(--mine-text);border-color:var(--mine)}
  #rooms .act{background:transparent;color:var(--muted);border-style:dashed}
  #bar{display:flex;align-items:center;gap:10px;padding:8px 14px;color:var(--muted);font-size:.85rem}
  #bar b{color:var(--text);flex:1;font-size:.95rem}
  #msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:0}
  .m{max-width:82%;padding:8px 12px;border-radius:14px;background:var(--other);line-height:1.55;word-break:break-word}
  .m.me{align-self:flex-start;background:var(--mine);color:var(--mine-text);border-bottom-left-radius:4px}
  .m:not(.me){align-self:flex-end;border-bottom-right-radius:4px}
  .m small{display:block;font-size:.72rem;opacity:.75;margin-bottom:2px}
  .m.pending{opacity:.6}
  .empty{margin:auto;color:var(--muted);text-align:center;line-height:1.8}
  form{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface)}
  input{flex:1;min-width:0;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .m{position:relative;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
  .m .more{position:absolute;top:2px;inset-inline-end:4px;background:transparent;color:inherit;opacity:.45;padding:0 6px;font-size:1.05rem;line-height:1.4;border-radius:8px}
  .m .more:hover,.m .more:focus-visible{opacity:1}
  .m .txt{display:block;padding-inline-end:14px;white-space:pre-wrap}
  .quote{display:block;width:100%;text-align:start;background:rgba(0,0,0,.18);color:inherit;font-weight:400;
         border:0;border-inline-start:3px solid rgba(255,255,255,.55);border-radius:8px;padding:4px 8px;margin-bottom:5px;font-size:.82rem}
  .m.me .quote{border-inline-start-color:rgba(42,27,0,.6);background:rgba(42,27,0,.12)}
  .quote b{display:block;font-size:.74rem;opacity:.85}
  .quote span{display:block;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
  .rx button{padding:1px 8px;font-size:.85rem;font-weight:500;border-radius:999px;background:rgba(0,0,0,.2);color:inherit;border:1px solid transparent}
  .m.me .rx button{background:rgba(42,27,0,.14)}
  .rx button.mine{border-color:currentColor}
  .m.flash{outline:2px solid var(--mine);outline-offset:2px}
  #replybar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border-top:1px solid var(--line);font-size:.85rem}
  #replybar[hidden]{display:none}
  #replybar div{flex:1;min-width:0;border-inline-start:3px solid var(--mine);padding-inline-start:8px;color:var(--muted)}
  #replybar b{display:block;color:var(--text);font-size:.8rem}
  #replybar span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #replybar button{padding:4px 10px}
  #epanel{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:8px 10px;background:var(--surface);border-top:1px solid var(--line)}
  #epanel[hidden]{display:none}
  #epanel button{background:transparent;font-size:1.4rem;padding:6px 0;border-radius:8px;min-height:44px}
  #emoji{padding:9px 12px;font-size:1.1rem;line-height:1}
  #sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,10,20,.6)}
  #sheet[hidden]{display:none}
  #sheet .card{width:100%;max-width:520px;background:var(--surface);border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));
               display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-bottom:0}
  #sheet .emo{display:flex;justify-content:space-between;gap:4px;margin-bottom:6px}
  #sheet .emo button{background:var(--bg);font-size:1.6rem;padding:8px 0;flex:1;min-height:48px}
  #sheet .emo button.on{outline:2px solid var(--mine)}
  #sheet .act{background:transparent;color:var(--text);text-align:start;font-weight:500;padding:14px 12px;border-radius:10px}
  #sheet .act:hover,#sheet .act:focus-visible{background:var(--bg)}
  #sheet .act.danger{color:#ff9b9b}
  #rooms .dm{border-color:#4f7cc4}
  form[hidden]{display:none}
  #mic{padding:9px 12px;font-size:1.1rem;line-height:1}
  #recbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface)}
  #recbar[hidden]{display:none}
  #recbar b{flex:1;font-variant-numeric:tabular-nums}
  #recbar .dot{width:10px;height:10px;border-radius:50%;background:#ff5d5d}
  @media (prefers-reduced-motion:no-preference){ #recbar .dot{animation:blink 1s infinite} }
  @keyframes blink{50%{opacity:.2}}
  .m audio{display:block;width:230px;max-width:100%;height:40px;margin-top:2px}
  .m .dur{display:block;font-size:.72rem;opacity:.7;margin-top:2px}
  #review{display:flex;flex-direction:column;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface)}
  #review[hidden]{display:none}
  #review audio{width:100%;height:40px}
  #review .row{display:flex;gap:8px}
  #review .row button:last-child{flex:1}
  #fxrow{display:flex;flex-wrap:wrap;gap:6px}
  #fxrow .chip{background:var(--bg);color:var(--text);border:1px solid var(--line);font-weight:500;padding:7px 12px}
  #fxrow .chip.on{background:var(--mine);color:var(--mine-text);border-color:var(--mine)}
  #finder{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,10,20,.6)}
  #finder[hidden]{display:none}
  #finder .card{width:100%;max-width:520px;max-height:80dvh;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;
                padding:14px 14px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-bottom:0}
  #finder .row{display:flex;gap:8px}
  #finder .hint{color:var(--muted);font-size:.8rem;line-height:1.6}
  #fres{display:flex;flex-direction:column;gap:6px}
  #fres button{background:var(--bg);color:var(--text);text-align:start;font-weight:500;padding:12px}
  @media (prefers-reduced-motion:no-preference){ .m{animation:in .15s ease-out} #sheet .card{animation:up .18s ease-out} }
  @keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<header>
  <h1>دردشة Unfollow Radar</h1>
  <a href="./index.html">رجوع للأداة</a>
  <button id="out" class="ghost" style="display:none">خروج</button>
</header>

<section id="login">
  <h2>سجّل الدخول للدردشة</h2>
  <p>ادخل بحساب Google لتشارك في الغرفة العامة أو تنشئ مجموعة مع أصدقائك.</p>
  <button id="in">الدخول بحساب Google</button>
  <p id="err" style="color:#ff9b9b"></p>
</section>

<section id="app">
  <div id="status"></div>
  <div id="rooms"></div>
  <div id="bar"><b id="title">الغرفة العامة</b><button id="code" class="ghost" style="display:none">نسخ رمز الدعوة</button></div>
  <div id="msgs"></div>
  <div id="replybar" hidden>
    <div><b id="rb-name"></b><span id="rb-text"></span></div>
    <button id="rb-x" type="button" class="ghost" aria-label="إلغاء الرد">✕</button>
  </div>
  <div id="epanel" hidden></div>
  <form id="f" autocomplete="off">
    <button id="emoji" type="button" class="ghost" aria-label="الرموز التعبيرية" aria-expanded="false">😊</button>
    <input id="t" placeholder="اكتب رسالة" maxlength="1000" aria-label="رسالة">
    <button id="mic" type="button" class="ghost" aria-label="تسجيل رسالة صوتية">🎤</button>
    <button type="submit">إرسال</button>
  </form>
  <div id="recbar" hidden>
    <button id="rc-x" type="button" class="ghost" aria-label="إلغاء التسجيل">🗑</button>
    <span class="dot"></span><b id="rtime">0:00</b>
    <button id="rc-ok" type="button">إيقاف ⏹</button>
  </div>
  <div id="review" hidden>
    <audio id="rv" controls preload="metadata"></audio>
    <div id="fxrow" role="group" aria-label="تغيير الصوت"></div>
    <div class="row">
      <button id="rv-x" type="button" class="ghost" aria-label="إلغاء">🗑</button>
      <button id="rv-ok" type="button">إرسال</button>
    </div>
  </div>
</section>

<div id="finder" hidden>
  <div class="card" role="dialog" aria-label="محادثة خاصة">
    <b>محادثة خاصة جديدة</b>
    <div class="row">
      <input id="fq" placeholder="اسم الشخص أو رمزه" aria-label="بحث">
      <button id="fgo" type="button">بحث</button>
    </div>
    <div id="fres"></div>
    <p class="hint" id="fmsg">اكتب بداية الاسم كما يظهر في حساب Google (الحروف اللاتينية حساسة للحرف الكبير)، أو الصق رمز صديقك.</p>
    <button id="fmycode" type="button" class="ghost">نسخ رمزي لأرسله لصديقي</button>
    <button id="fclose" type="button" class="ghost">إغلاق</button>
  </div>
</div>

<div id="sheet" hidden>
  <div class="card" role="dialog" aria-label="خيارات الرسالة">
    <div class="emo" id="sh-emo"></div>
    <button class="act" id="sh-reply" type="button">↩ رد</button>
    <button class="act" id="sh-copy" type="button">نسخ النص</button>
    <button class="act danger" id="sh-del" type="button">مسح الرسالة</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, deleteField, arrayUnion, query, where, orderBy, limit, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA5_-Qg0XcIVzaP2_iljrhSFJIrYOQP69k",
  authDomain: "unfollow-radar-f4508.firebaseapp.com",
  projectId: "unfollow-radar-f4508",
  storageBucket: "unfollow-radar-f4508.firebasestorage.app",
  messagingSenderId: "160025889873",
  appId: "1:160025889873:web:71b2bcfdfc4c8081433c70"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});

const $ = id => document.getElementById(id);
let me = null, room = { type: "public", id: null, name: "الغرفة العامة" };
let unsubMsgs = null, unsubGroups = null, unsubDms = null, groups = [], dms = [];

/* ---------- تسجيل الدخول ---------- */
$("in").onclick = async () => {
  $("err").textContent = "";
  const p = new GoogleAuthProvider();
  try { await signInWithPopup(auth, p); }
  catch (e) {
    if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") {
      try { await signInWithRedirect(auth, p); return; } catch (e2) { e = e2; }
    }
    $("err").textContent = "تعذّر تسجيل الدخول (" + (e.code || "خطأ") + "). تأكد من الاتصال بالإنترنت وحاول مرة أخرى.";
  }
};
$("out").onclick = () => signOut(auth);

onAuthStateChanged(auth, async u => {
  me = u;
  $("login").style.display = u ? "none" : "flex";
  $("app").style.display = u ? "flex" : "none";
  $("out").style.display = u ? "" : "none";
  if (unsubMsgs) unsubMsgs(); if (unsubGroups) unsubGroups(); if (unsubDms) unsubDms();
  if (!u) return;
  setDoc(doc(db, "users", u.uid), { name: u.displayName || "مستخدم", photo: u.photoURL || "", seen: serverTimestamp() }, { merge: true }).catch(() => {});
  unsubGroups = onSnapshot(query(collection(db, "groups"), where("members", "array-contains", u.uid)),
    s => { groups = s.docs.map(d => ({ id: d.id, ...d.data() })); renderRooms(); });
  unsubDms = onSnapshot(query(collection(db, "dms"), where("members", "array-contains", u.uid)),
    s => { dms = s.docs.map(d => ({ id: d.id, ...d.data() })); renderRooms(); });
  openRoom({ type: "public", id: null, name: "الغرفة العامة" });
});

/* ---------- الغرف ---------- */
function renderRooms() {
  const box = $("rooms"); box.textContent = "";
  const add = (label, cls, fn) => { const b = document.createElement("button"); b.textContent = label; if (cls) b.className = cls; b.onclick = fn; box.appendChild(b); return b; };
  add("العامة", room.type === "public" ? "on" : "", () => openRoom({ type: "public", id: null, name: "الغرفة العامة" }));
  groups.forEach(g => add(g.name, room.type === "group" && room.id === g.id ? "on" : "", () => openRoom({ type: "group", id: g.id, name: g.name })));
  dms.forEach(d => {
    const other = (d.members || []).find(x => x !== me.uid);
    const nm = (d.names && d.names[other]) || "مستخدم";
    add("👤 " + nm, "dm" + (room.type === "dm" && room.id === d.id ? " on" : ""), () => openRoom({ type: "dm", id: d.id, name: nm }));
  });
  add("+ محادثة خاصة", "act", openFinder);
  add("+ مجموعة", "act", createGroup);
  add("انضمام برمز", "act", joinGroup);
}

async function createGroup() {
  const name = (prompt("اسم المجموعة؟") || "").trim().slice(0, 40);
  if (!name) return;
  try {
    const ref = await addDoc(collection(db, "groups"), { name, members: [me.uid], createdBy: me.uid, createdAt: serverTimestamp() });
    openRoom({ type: "group", id: ref.id, name });
  } catch (e) { alert("تعذّر إنشاء المجموعة. تحقق من الإنترنت."); }
}

async function joinGroup() {
  const id = (prompt("الصق رمز الدعوة") || "").trim();
  if (!id) return;
  try {
    await updateDoc(doc(db, "groups", id), { members: arrayUnion(me.uid) });
    const g = groups.find(x => x.id === id);
    openRoom({ type: "group", id, name: g ? g.name : "مجموعة" });
  } catch (e) { alert("رمز غير صحيح أو لا يوجد اتصال."); }
}

$("code").onclick = async () => {
  try { await navigator.clipboard.writeText(room.id); $("code").textContent = "تم النسخ"; }
  catch { prompt("رمز الدعوة:", room.id); }
  setTimeout(() => $("code").textContent = "نسخ رمز الدعوة", 1500);
};

function path() {
  if (room.type === "public") return ["public"];
  if (room.type === "dm") return ["dms", room.id, "messages"];
  return ["groups", room.id, "messages"];
}

/* ---------- محادثات خاصة ---------- */
const dmId = (a, b) => [a, b].sort().join("_");
async function startDm(uid, name) {
  if (!uid || uid === me.uid) return fail("لا يمكنك مراسلة نفسك.");
  const id = dmId(me.uid, uid);
  try {
    await setDoc(doc(db, "dms", id), {
      members: [me.uid, uid].sort(),
      names: { [me.uid]: me.displayName || "مستخدم", [uid]: name || "مستخدم" }
    }, { merge: true });
  } catch (e) { return fail("تعذّر فتح المحادثة (" + (e.code || "خطأ") + ")."); }
  closeFinder();
  openRoom({ type: "dm", id, name: name || "مستخدم" });
}
function openFinder() { $("fq").value = ""; $("fres").textContent = ""; $("finder").hidden = false; $("fq").focus(); }
function closeFinder() { $("finder").hidden = true; }
$("fclose").onclick = closeFinder;
$("finder").addEventListener("click", e => { if (e.target === $("finder")) closeFinder(); });
$("fmycode").onclick = async () => {
  try { await navigator.clipboard.writeText(me.uid); $("fmsg").textContent = "تم نسخ رمزك. أرسله لصديقك ليلصقه هنا."; }
  catch { prompt("رمزي:", me.uid); }
};
$("fgo").onclick = async () => {
  const q = $("fq").value.trim(), box = $("fres"), msg = $("fmsg");
  box.textContent = ""; if (!q) return;
  try {
    if (/^[A-Za-z0-9]{20,}$/.test(q)) {
      const d = await getDoc(doc(db, "users", q));
      if (!d.exists()) { msg.textContent = "لا يوجد مستخدم بهذا الرمز."; return; }
      return startDm(q, d.data().name);
    }
    const snap = await getDocs(query(collection(db, "users"), where("name", ">=", q), where("name", "<=", q + "\uf8ff"), limit(10)));
    const found = snap.docs.filter(d => d.id !== me.uid);
    msg.textContent = found.length ? "اختر شخصًا:" : "لا نتائج. جرّب جزءًا آخر من الاسم، أو استعمل الرمز.";
    found.forEach(d => {
      const b = document.createElement("button"); b.type = "button";
      b.textContent = d.data().name || "مستخدم";
      b.onclick = () => startDm(d.id, d.data().name);
      box.appendChild(b);
    });
  } catch (e) { msg.textContent = "تعذّر البحث (" + (e.code || "خطأ") + ")."; }
};
$("fq").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("fgo").click(); } });

const REACTIONS = ["👍","❤️","😂","😮","😢","🙏"];
const EMOJIS = ["😀","😂","🤣","😊","😍","🥰","😘","😎","🤔","😅","😭","😡","🥳","😴","🤝","🙏",
                "👍","👎","👏","🙌","💪","👀","🔥","✨","❤️","💔","🎉","💯","✅","❌","🌹","☕"];
let stick = true, replying = null, current = null, openedAt = 0;

const msgRef = id => doc(db, ...path(), id);
const fail = msg => { $("status").className = "off"; $("status").textContent = msg; };

function openRoom(r) {
  room = r; stick = true; clearReply(); closeSheet(); if (rec) stopRec(false); closeReview();
  $("title").textContent = r.name;
  $("code").style.display = r.type === "group" ? "" : "none";
  renderRooms();
  if (unsubMsgs) unsubMsgs();
  const q = query(collection(db, ...path()), orderBy("createdAt", "desc"), limit(60));
  unsubMsgs = onSnapshot(q, { includeMetadataChanges: true }, snap => {
    const box = $("msgs");
    const near = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
    const pl = [...box.querySelectorAll("audio")].find(a => !a.paused);
    const resume = pl ? { id: pl.dataset.id, t: pl.currentTime } : null;
    box.textContent = "";
    const list = snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: "estimate" }), pending: d.metadata.hasPendingWrites })).reverse();
    if (!list.length) {
      const e = document.createElement("div"); e.className = "empty"; e.textContent = "لا توجد رسائل بعد. اكتب أول رسالة."; box.appendChild(e);
    }
    list.forEach(m => box.appendChild(renderMsg(m)));
    if (resume) {
      const a = box.querySelector('audio[data-id="' + resume.id + '"]');
      if (a) { a.currentTime = resume.t; a.play().catch(() => {}); }
    }
    if (stick || near) { box.scrollTop = box.scrollHeight; stick = false; }
    setStatus(snap.metadata.fromCache);
  }, err => { $("status").textContent = "لا يمكن قراءة هذه الغرفة: " + err.code; });
}

function renderMsg(m) {
  const mine = m.uid === me.uid;
  const el = document.createElement("div");
  el.id = "m-" + m.id;
  el.className = "m" + (mine ? " me" : "") + (m.pending ? " pending" : "");
  if (!mine) { const s = document.createElement("small"); s.textContent = m.name || "مستخدم"; el.appendChild(s); }

  if (m.replyTo) {
    const q = document.createElement("button"); q.type = "button"; q.className = "quote";
    const n = document.createElement("b"); n.textContent = m.replyTo.name || "مستخدم";
    const t = document.createElement("span"); t.textContent = m.replyTo.text || "";
    q.append(n, t);
    q.onclick = () => {
      const target = document.getElementById("m-" + m.replyTo.id);
      if (!target) return fail("الرسالة الأصلية لم تعد موجودة.");
      target.scrollIntoView({ block: "center", behavior: "smooth" });
      target.classList.add("flash"); setTimeout(() => target.classList.remove("flash"), 1200);
    };
    el.appendChild(q);
  }

  if (m.audio) {
    const a = document.createElement("audio"); a.controls = true; a.preload = "metadata";
    a.dataset.id = m.id; setFx(a, m.fx); a.src = m.audio; el.appendChild(a);
    if (m.dur || m.fx) {
      const d = document.createElement("span"); d.className = "dur";
      d.textContent = "🎤 " + (m.dur ? fmtTime(m.dur) : "") + (FX[m.fx] && m.fx !== "normal" ? " · " + FX[m.fx].label : "");
      el.appendChild(d);
    }
  } else {
    const txt = document.createElement("span"); txt.className = "txt"; txt.textContent = m.text; el.appendChild(txt);
  }

  const counts = {};
  Object.values(m.reactions || {}).forEach(e => counts[e] = (counts[e] || 0) + 1);
  if (Object.keys(counts).length) {
    const rx = document.createElement("div"); rx.className = "rx";
    Object.entries(counts).forEach(([e, n]) => {
      const b = document.createElement("button"); b.type = "button";
      b.textContent = n > 1 ? e + " " + n : e;
      if ((m.reactions || {})[me.uid] === e) b.className = "mine";
      b.setAttribute("aria-label", "تفاعل " + e + " (" + n + ")");
      b.onclick = () => react(m, e);
      rx.appendChild(b);
    });
    el.appendChild(rx);
  }

  const more = document.createElement("button"); more.type = "button"; more.className = "more";
  more.textContent = "⋯"; more.setAttribute("aria-label", "خيارات الرسالة");
  more.onclick = () => openSheet(m);
  el.appendChild(more);
  bindPress(el, m);
  return el;
}

/* ---------- ضغطة طويلة / قائمة الرسالة ---------- */
function bindPress(el, m) {
  let t = null, sx = 0, sy = 0;
  const clear = () => { clearTimeout(t); t = null; };
  el.addEventListener("touchstart", e => {
    const p = e.touches[0]; sx = p.clientX; sy = p.clientY;
    t = setTimeout(() => { t = null; if (navigator.vibrate) navigator.vibrate(15); openSheet(m); }, 450);
  }, { passive: true });
  el.addEventListener("touchmove", e => {
    const p = e.touches[0];
    if (Math.abs(p.clientX - sx) > 10 || Math.abs(p.clientY - sy) > 10) clear();
  }, { passive: true });
  el.addEventListener("touchend", clear);
  el.addEventListener("touchcancel", clear);
  el.addEventListener("contextmenu", e => { e.preventDefault(); if ($("sheet").hidden) openSheet(m); });
}

function openSheet(m) {
  current = m; openedAt = Date.now();
  const mineReact = (m.reactions || {})[me.uid];
  const box = $("sh-emo"); box.textContent = "";
  REACTIONS.forEach(e => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = e;
    if (mineReact === e) b.className = "on";
    b.setAttribute("aria-label", "تفاعل " + e);
    b.onclick = () => { closeSheet(); react(m, e); };
    box.appendChild(b);
  });
  $("sh-del").style.display = m.uid === me.uid ? "" : "none";
  $("sh-copy").style.display = m.audio ? "none" : "";
  $("sheet").hidden = false;
  $("sh-reply").focus();
}
function closeSheet() { $("sheet").hidden = true; current = null; }
$("sheet").addEventListener("click", e => {
  if (e.target === $("sheet") && Date.now() - openedAt > 350) closeSheet();
});
addEventListener("keydown", e => { if (e.key === "Escape") { closeSheet(); closeFinder(); } });

$("sh-reply").onclick = () => { const m = current; closeSheet(); if (m) setReply(m); };
$("sh-copy").onclick = async () => {
  const m = current; closeSheet(); if (!m) return;
  try { await navigator.clipboard.writeText(m.text); } catch { prompt("انسخ النص:", m.text); }
};
$("sh-del").onclick = async () => {
  const m = current; closeSheet();
  if (!m || m.uid !== me.uid) return;
  if (!confirm("مسح هذه الرسالة عند الجميع؟")) return;
  try { await deleteDoc(msgRef(m.id)); }
  catch (e) { fail("تعذّر مسح الرسالة (" + (e.code || "خطأ") + ")."); }
};

/* ---------- التفاعل بالرموز ---------- */
function react(m, emoji) {
  const key = "reactions." + me.uid;
  const same = (m.reactions || {})[me.uid] === emoji;
  updateDoc(msgRef(m.id), { [key]: same ? deleteField() : emoji })
    .catch(e => fail("تعذّر إضافة التفاعل (" + (e.code || "خطأ") + ")."));
}

/* ---------- الرد على رسالة ---------- */
function setReply(m) {
  replying = { id: m.id, name: m.name || "مستخدم", text: (m.text || "").slice(0, 80) };
  $("rb-name").textContent = replying.name;
  $("rb-text").textContent = replying.text;
  $("replybar").hidden = false;
  $("t").focus();
}
function clearReply() { replying = null; $("replybar").hidden = true; }
$("rb-x").onclick = clearReply;

/* ---------- الرموز التعبيرية في الكتابة ---------- */
(() => {
  const p = $("epanel");
  EMOJIS.forEach(e => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = e;
    b.setAttribute("aria-label", e);
    b.onclick = () => {
      const i = $("t"), a = i.selectionStart ?? i.value.length, z = i.selectionEnd ?? a;
      if (i.value.length + e.length > i.maxLength) return;
      i.value = i.value.slice(0, a) + e + i.value.slice(z);
      i.focus(); i.setSelectionRange(a + e.length, a + e.length);
    };
    p.appendChild(b);
  });
  $("emoji").onclick = () => {
    p.hidden = !p.hidden;
    $("emoji").setAttribute("aria-expanded", String(!p.hidden));
  };
})();

/* ---------- الإرسال ---------- */
function sendMsg(extra) {
  const data = { text: "", uid: me.uid, name: me.displayName || "مستخدم", createdAt: serverTimestamp(), ...extra };
  if (replying) data.replyTo = replying;
  clearReply(); stick = true;
  // بدون await: عند انقطاع الإنترنت تُحفظ الرسالة محليًا وتُرسل لاحقًا
  addDoc(collection(db, ...path()), data)
    .catch(() => { $("status").className = "off"; $("status").textContent = "تعذّر إرسال الرسالة. ليس لديك صلاحية في هذه الغرفة."; });
}
$("f").onsubmit = e => {
  e.preventDefault();
  const text = $("t").value.trim();
  if (!text) return;
  $("t").value = "";
  sendMsg({ text });
};

/* ---------- رسائل صوتية ---------- */
const MAX_REC = 45;
let rec = null;
const fmtTime = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
function pickMime() {
  if (!window.MediaRecorder) return "";
  for (const t of ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg;codecs=opus"])
    if (MediaRecorder.isTypeSupported(t)) return t;
  return "";
}
async function startRec() {
  if (rec) return;
  if (!window.MediaRecorder || !navigator.mediaDevices) return fail("هذا المتصفح لا يدعم التسجيل الصوتي.");
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { return fail("لم يتم السماح باستعمال الميكروفون. فعّله من إعدادات المتصفح ثم حاول مرة أخرى."); }
  const mime = pickMime();
  const mr = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 20000 } : { audioBitsPerSecond: 20000 });
  rec = { mr, stream, chunks: [], t0: Date.now(), send: false, mime: mr.mimeType || mime, timer: null };
  mr.ondataavailable = e => { if (e.data && e.data.size) rec.chunks.push(e.data); };
  mr.onstop = onRecStop;
  mr.start();
  $("recbar").hidden = true; $("f").hidden = true; $("recbar").hidden = false; $("epanel").hidden = true;
  recTick(); rec.timer = setInterval(recTick, 250);
}
function recTick() {
  if (!rec) return;
  const s = (Date.now() - rec.t0) / 1000;
  $("rtime").textContent = fmtTime(s) + " / " + fmtTime(MAX_REC);
  if (s >= MAX_REC) stopRec(true);
}
function stopRec(send) {
  if (!rec) return;
  rec.send = send; clearInterval(rec.timer);
  if (rec.mr.state !== "inactive") rec.mr.stop();
}
async function onRecStop() {
  const r = rec; rec = null;
  r.stream.getTracks().forEach(t => t.stop());
  $("recbar").hidden = true; $("f").hidden = false;
  if (!r.send) return;
  const dur = Math.round((Date.now() - r.t0) / 1000);
  if (dur < 1 || !r.chunks.length) return;
  const blob = new Blob(r.chunks, { type: r.mime || "audio/webm" });
  let url;
  try {
    url = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
  } catch { return fail("تعذّر تجهيز التسجيل."); }
  if (url.length > 700000) return fail("التسجيل كبير جدًا. سجّل رسالة أقصر.");
  showReview(url, dur);
}

/* ---------- تغيير الصوت (تأثيرات) ---------- */
const FX = {
  normal: { label: "🎙 عادي" },
  robot:  { label: "🤖 روبوت" },
  funny:  { label: "🐿 مضحك", rate: 1.55 },
  deep:   { label: "👹 غليظ", rate: 0.72 },
  alien:  { label: "👽 فضائي" },
  echo:   { label: "🏔 صدى" },
  phone:  { label: "📞 هاتف" }
};
const GRAPH = new Set(["robot", "alien", "echo", "phone"]);
let actx = null;
function getCtx() {
  if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); }
  return actx;
}
const unlockAudio = () => { const c = getCtx(); if (c && c.state === "suspended") c.resume(); };
["pointerdown", "touchend", "click", "keydown"].forEach(ev => addEventListener(ev, unlockAudio, { capture: true }));

function buildChain(fx, ctx, src) {
  const nodes = [], oscs = [], out = ctx.destination;
  const mk = n => { nodes.push(n); return n; };
  if (fx === "robot" || fx === "alien") {
    const ring = mk(ctx.createGain()); ring.gain.value = 0;
    const osc = ctx.createOscillator(); osc.type = "sine"; osc.frequency.value = fx === "robot" ? 50 : 380;
    osc.connect(ring.gain); osc.start(); oscs.push(osc);
    const up = mk(ctx.createGain()); up.gain.value = 1.7;
    src.connect(ring); ring.connect(up); up.connect(out);
    if (fx === "alien") { const dry = mk(ctx.createGain()); dry.gain.value = 0.4; src.connect(dry); dry.connect(out); }
  } else if (fx === "echo") {
    const d = mk(ctx.createDelay(1)); d.delayTime.value = 0.28;
    const fb = mk(ctx.createGain()); fb.gain.value = 0.4;
    const wet = mk(ctx.createGain()); wet.gain.value = 0.6;
    src.connect(out); src.connect(d); d.connect(fb); fb.connect(d); d.connect(wet); wet.connect(out);
  } else if (fx === "phone") {
    const hp = mk(ctx.createBiquadFilter()); hp.type = "highpass"; hp.frequency.value = 500;
    const lp = mk(ctx.createBiquadFilter()); lp.type = "lowpass"; lp.frequency.value = 3000;
    const g = mk(ctx.createGain()); g.gain.value = 1.5;
    src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(out);
  } else { src.connect(out); }
  return { stop() {
    oscs.forEach(o => { try { o.stop(); } catch {} });
    nodes.forEach(n => { try { n.disconnect(); } catch {} });
  } };
}
function unwireFx(a) { if (a._chain) { a._chain.stop(); a._chain = null; } }
function wireFx(a) {
  const fx = a.dataset.fx || "normal", ctx = getCtx();
  if (!ctx) return;
  const needs = GRAPH.has(fx);
  if (!needs && !a._src) return;
  if (ctx.state === "suspended") ctx.resume();
  if (!a._src) { try { a._src = ctx.createMediaElementSource(a); } catch { return; } }
  unwireFx(a);
  try { a._src.disconnect(); } catch {}
  a._chain = buildChain(needs ? fx : "normal", ctx, a._src);
}
function setFx(a, fx) {
  fx = FX[fx] ? fx : "normal"; a.dataset.fx = fx;
  const rate = FX[fx].rate || 1;
  a.defaultPlaybackRate = rate; a.playbackRate = rate;
  a.preservesPitch = a.mozPreservesPitch = a.webkitPreservesPitch = (rate === 1);
  if (!a._fxHook) {
    a._fxHook = true;
    a.addEventListener("play", () => wireFx(a));
    a.addEventListener("pause", () => unwireFx(a));
    a.addEventListener("ended", () => unwireFx(a));
  }
  if (!a.paused) wireFx(a);
}

/* ---------- مراجعة التسجيل قبل الإرسال ---------- */
let pending = null, chosen = "normal";
function renderChips() {
  const box = $("fxrow"); box.textContent = "";
  Object.entries(FX).forEach(([k, f]) => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = f.label;
    b.className = "chip" + (k === chosen ? " on" : "");
    b.onclick = () => {
      chosen = k; renderChips();
      const rv = $("rv"); setFx(rv, k); rv.currentTime = 0; rv.play().catch(() => {});
    };
    box.appendChild(b);
  });
}
function showReview(url, dur) {
  pending = { url, dur }; chosen = "normal";
  const rv = $("rv"); rv.pause(); setFx(rv, "normal"); rv.src = url;
  renderChips();
  $("f").hidden = true; $("recbar").hidden = true; $("review").hidden = false;
}
function closeReview() {
  const rv = $("rv"); rv.pause(); rv.removeAttribute("src"); rv.load();
  pending = null; $("review").hidden = true; if (!rec) $("f").hidden = false;
}
$("rv-x").onclick = closeReview;
$("rv-ok").onclick = () => {
  if (!pending) return;
  const extra = { text: "🎤 رسالة صوتية", audio: pending.url, dur: pending.dur };
  if (chosen !== "normal") extra.fx = chosen;
  closeReview(); sendMsg(extra);
};
$("mic").onclick = startRec;
$("rc-x").onclick = () => stopRec(false);
$("rc-ok").onclick = () => stopRec(true);

/* ---------- حالة الاتصال ---------- */
function setStatus(fromCache) {
  const off = !navigator.onLine || fromCache;
  $("status").className = off ? "off" : "";
  $("status").textContent = off ? "وضع بدون إنترنت: رسائلك تُحفظ وتُرسل عند عودة الاتصال" : "متصل";
}
addEventListener("online", () => setStatus(false));
addEventListener("offline", () => setStatus(true));
</script>
</body>
</html>
